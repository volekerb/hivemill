<!doctype html>
<html><head><meta charset="utf-8"><title>beta</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;align-items:center;justify-content:center;font:700 120px sans-serif;color:#fff}</style>
</head><body><div id="t">beta</div>
<script>
window.seek = function (t) {
  document.body.style.background = 'hsl(' + Math.round(t * 90 + ("beta" === "beta" ? 180 : 0)) + ',60%,35%)';
  document.getElementById('t').textContent = "beta " + t.toFixed(2);
};
window.seek(0);
window.filmReady = true;
</script></body></html>
