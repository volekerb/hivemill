<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Scene: hook</title>
<link rel="stylesheet" href="theme.css">
<style>
.fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; z-index:9; }
@keyframes fade-in { from { opacity:1; } to { opacity:0; } }
@keyframes fade-out { from { opacity:0; } to { opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(48px); } to { opacity:1; transform:none; } }
@keyframes show { from { opacity:0; } to { opacity:1; } }
@keyframes blink { 0%, 49% { opacity:1; } 50%, 100% { opacity:0; } }
.fade { animation: fade-in .5s linear 0s 1 both, fade-out .5s linear 5.5s 1 forwards; }
.caption-bar { display:none !important; }
.hero { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; text-align:center; padding:0 80px; }
.l1, .l2 { font-size:96px; font-weight:bold; line-height:1.12; white-space:nowrap; }
.l1 .ch { white-space:pre; opacity:0; animation: show .01s linear 1 both; }  /* one glyph per step: no frame shows a cut glyph */
.l2 { color:var(--lead); animation: rise .8s cubic-bezier(.2,.8,.2,1) 2.4s 1 both; }
.chip { margin-bottom:24px; animation: rise .6s ease-out .2s 1 both; }

</style></head>

</div>
