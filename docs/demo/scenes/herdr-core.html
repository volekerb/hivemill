<script>
(function () {
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ramp(t, a, b) { return clamp((t - a) / (b - a)); }
  function $(id) { return document.getElementById(id); }
  demo.on(function (t) {
    $("l0").style.opacity = ramp(t, 0.0, 0.8);
    $("l1").style.opacity = ramp(t, 4.0, 4.8);
    $("l2").style.opacity = ramp(t, 8.0, 8.8);
    $("l3").style.opacity = ramp(t, 12.0, 12.8);
  });
  demo.seek(0);
})();
</script>
