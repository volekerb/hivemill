<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Scene: runtimes</title>
<link rel="stylesheet" href="theme.css">
<style>
.panel { position:absolute; left:160px; top:220px; width:1600px; min-height:520px; background:var(--panel); border:3px solid var(--line); border-radius:22px; padding:56px 72px; text-align:center; }
.title { font-size:var(--fs-title); font-weight:bold; margin-bottom:48px; opacity:0; }
.row { display:flex; justify-content:center; gap:80px; margin-bottom:56px; }
.rt { width:520px; padding:44px 36px; background:#05080f; border:3px solid var(--line); border-radius:18px; font-size:var(--fs-title); font-weight:bold; opacity:0; }
.rt.claude { color:var(--lead); border-color:var(--lead); }
.rt.cursor { color:var(--coder); border-color:var(--coder); }
.line { font-size:56px; font-weight:bold; line-height:1.2; margin:20px 0; opacity:0; }
.sub { color:var(--muted); font-size:var(--fs-body); margin-top:12px; opacity:0; }
</style></head>
<body data-scene="runtimes">
<div class="stage">
<div class="wordmark"><span data-brand="wordmark_svg"></span><span data-brand="name"></span></div>
<div class="panel card">
<div class="title" id="t0">Claude and Cursor</div>
<div class="row">
<div class="rt claude card" id="r0">Claude</div>
<div class="rt cursor card" id="r1">Cursor</div>
</div>
<div class="line" id="l0">The factory runs workers on Claude and on Cursor.</div>
<div class="line sub" id="l1">Same chain of command. Two runtimes.</div>
</div>
<div class="caption-bar"><span></span></div>
</div>
<script type="application/json" id="demo-data">{"scene": "runtimes", "duration": 12, "captions": [{"at": 0.0, "until": 4.0, "text": "Claude and Cursor"}, {"at": 4.0, "until": 8.0, "text": "The factory runs workers on Claude and on Cursor."}, {"at": 8.0, "until": 12.0, "text": "Same chain of command. Two runtimes."}], "brand": {"name": "Hivemill", "wordmark_svg": "../images/wordmark-dark.svg", "tagline": "Talk to one agent. A whole team ships your PRs.", "install": "gh repo clone volekerb/hivemill ~/factory", "github_url": "github.com/volekerb/hivemill"}}</script>
<script src="demo.js"></script>
<script>
(function () {
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ramp(t, a, b) { return clamp((t - a) / (b - a)); }
  function $(id) { return document.getElementById(id); }
  demo.on(function (t) {
    $("t0").style.opacity = ramp(t, 0.0, 0.6);
    $("r0").style.opacity = ramp(t, 0.4, 1.0);
    $("r1").style.opacity = ramp(t, 0.8, 1.4);
    $("l0").style.opacity = ramp(t, 4.0, 5.2);
    $("l1").style.opacity = ramp(t, 8.0, 9.2);
  });
  demo.seek(0);
})();
</script>
</body></html>
