<script type="application/json" id="demo-data">{"scene": "orgchart", "duration": 10, "captions": [{"at": 0.0, "until": 5.0, "text": "The boss briefs a director. The director staffs a team."}, {"at": 5.0, "until": 10.0, "text": "pm, coder, QA, reviewer, judge. One job each."}], "brand": {"name": "Hivemill", "wordmark_svg": "../images/wordmark-dark.svg", "tagline": "Talk to one agent. A whole team ships your PRs.", "install": "gh repo clone volekerb/hivemill ~/factory", "github_url": "github.com/volekerb/hivemill"}}</script>
<script src="demo.js"></script>
<script>
/* Loopable: every visual is a pure function of t. Nothing is lit at t=0, everything fades out over 9.0-10.0 s, so
 * t=10.0 is the same picture as t=0.0 (hero cut 0.0-10.0 with demo.captions(false)). Glow period 2.5 s = 10 s / 4.
 * The team is complete by 5.8 s and the pulses end by 8.0 s, so the 8 s LinkedIn cut loses only the hold and the fade. */
(function () {
  var SPAWN = {"boss": 0.6, "director": 1.4, "lead": 2.2, "pm": 3.0, "coder": 3.6, "qa": 4.2, "reviewer": 4.8, "judge": 5.4};
  var EDGES = [["boss", "director"], ["director", "lead"], ["lead", "pm"], ["lead", "coder"], ["lead", "qa"], ["lead", "reviewer"], ["lead", "judge"]];
  var PULSES = [[6.0, 0], [6.2, 1], [6.4, 2], [6.6, 3], [6.8, 4], [7.0, 5], [7.1, 6]];  /* [start, edge], 0.9 s each */
  var LOOP = 10;
  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function env(t) { return t >= LOOP ? 0 : t > LOOP - 1 ? LOOP - t : 1; }
  function q(x) { return Math.round(x * 1000) / 1000; }
  var nodes = {}, paths = [], dots = [];
  Object.keys(SPAWN).forEach(function (r) { var g = document.getElementById("n-" + r); nodes[r] = {g: g, rect: g.querySelector("rect"), sd: g.querySelector(".sd"), chip: g.querySelector(".chip-t")}; });
  EDGES.forEach(function (e, i) { paths.push(document.getElementById("e" + i)); dots.push(document.getElementById("p" + i)); });
  demo.on(function (t) {
    var e = env(t);
    var glow = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / 2.5);
    Object.keys(SPAWN).forEach(function (r) {
      var n = nodes[r], lit = clamp((t - SPAWN[r]) / 0.5) * e;
      n.g.setAttribute("opacity", q(0.3 + 0.7 * lit));
      n.sd.setAttribute("fill", lit > 0.5 ? "#5fd68a" : "#9aa7cf");
      n.chip.textContent = lit > 0.5 ? "live" : "idle";
      n.rect.style.filter = "drop-shadow(0 0 " + q(lit * (6 + 18 * glow)) + "px var(--accent)) drop-shadow(0 10px 16px rgba(2,4,12,0.55))";
    });
    EDGES.forEach(function (ed, i) {
      paths[i].setAttribute("opacity", q(0.2 + 0.6 * clamp((t - SPAWN[ed[1]] + 0.2) / 0.5) * e));
      var d = dots[i], vis = 0, pt = null;
      /* spawn pulse: parent -> child just before the child lights up */
      var s = (t - (SPAWN[ed[1]] - 0.8)) / 0.8;
      if (s >= 0 && s <= 1) { vis = 1; pt = s; }
      PULSES.forEach(function (p) { if (p[1] === i) { var u = (t - p[0]) / 0.9; if (u >= 0 && u <= 1) { vis = 1; pt = u; } } });
      if (vis) { var L = paths[i].getTotalLength(), xy = paths[i].getPointAtLength(L * pt); d.setAttribute("cx", q(xy.x)); d.setAttribute("cy", q(xy.y)); }
      d.setAttribute("opacity", vis * e);
    });
  });
  demo.seek(0);
})();
</script>
