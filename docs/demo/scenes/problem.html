<style>
.fade { position:absolute; inset:0; background:var(--bg); pointer-events:none; opacity:0; z-index:9; }
@keyframes fade-in { from { opacity:1; } to { opacity:0; } }
@keyframes fade-out { from { opacity:0; } to { opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(48px); } to { opacity:1; transform:none; } }
@keyframes show { from { opacity:0; } to { opacity:1; } }
@keyframes strike { from { transform:scaleX(0); } to { transform:scaleX(1); } }

.l1, .l2 { font-size:96px; font-weight:bold; line-height:1.12; white-space:nowrap; }

.ch { white-space:pre; opacity:0; animation: show .01s linear 1 both; }  /* one glyph per step: no frame shows a cut glyph */
.done { position:relative; display:inline-block; color:var(--ok); animation: caught .3s linear 4s 1 both; }
.strike { position:absolute; left:-6px; right:-6px; top:54%; height:10px; border-radius:5px; background:var(--qa);
