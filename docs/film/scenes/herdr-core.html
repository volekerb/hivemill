<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Herdr app panel</title>
<link rel="stylesheet" href="film.css">
<style>
  /* Plain dark backdrop close to the panel's own background. */
  body { background: rgb(11,11,12); }
  .backdrop { opacity: 0.45; }
  .head { position: absolute; left: 72px; top: 40px; }
  .head .title { font-size: 56px; }
  .head .sub { margin-top: 10px; font-size: 27px; color: var(--ink-2); }
  .runtimes { position: absolute; right: 72px; top: 110px; }
  .brand { top: 48px; }
  /* Every crop is drawn at its natural pixel size; only translate and opacity move it. */
  .panel { position: absolute; display: block; left: 0; top: 0; }
  #p-resources { width: 617px; height: 489px; }
  #p-budget { width: 616px; height: 528px; }
  #p-factory { width: 617px; height: 194px; }
  /* Clip to the first eight goal rows (crop y < 298): a later row's title contains a word the scene must not show. */
  #p-goals { width: 617px; height: 409px; clip-path: inset(0 0 111px 0); }
  #p-status { width: 1920px; height: 28px; }
  .ring { border-radius: 8px; }
  #ring-status { border-radius: 4px; }
</style>
</head><body>
<div class="backdrop"></div>
<div class="stage">
  <div class="head" id="head">
    <h1 class="title">Herdr app panel</h1>
    <div class="sub">live agents · weekly usage · cost per merged PR</div>
  </div>
  <div class="runtimes chip info" id="runtimes">classic Herdr terminal · herdr-core</div>
  <img class="brand" id="brand" src="../../images/wordmark-dark.svg" alt="Hivemill">

  <img class="panel" id="p-resources" src="../herdr/panel-resources.png" alt="Resources card">
  <img class="panel" id="p-budget" src="../herdr/panel-budget.png" alt="Budget and cost card">
  <img class="panel" id="p-factory" src="../herdr/panel-factory.png" alt="Factory card">
  <img class="panel" id="p-goals" src="../herdr/panel-active-goals.png" alt="Active goals">
  <div class="ring" id="ring-sandbox"></div>
  <img class="panel" id="p-status" src="../herdr/panel-status-bar.png" alt="Status bar">
  <div class="ring" id="ring-status"></div>
</div>
<script src="film.js"></script>
<script>
(function () {
  'use strict';
  const { prog, fade, tr, $, lerp, easeInOut } = Film;
  // Final positions: the panel's own column layout, tightened vertically. All whole pixels, all y < 940.
  const POS = {
    resources: [23, 190], budget: [652, 190], factory: [1280, 190], goals: [1280, 400], status: [0, 866],
  };
  const SANDBOX_ROW = { x: 8, y: 28, w: 601, h: 32 };   // "Worker sandbox" row inside panel-active-goals.png

  function place(el, key, dx, dy, op) {
    const [x, y] = POS[key];
    el.style.transform = tr(x + dx, y + dy);
    el.style.opacity = op.toFixed(3);
  }

  function seek(t) {
    const h = fade(t, 0.0, 0.5);
    $('#head').style.opacity = h; $('#head').style.transform = tr(0, 16 * (1 - h));
    $('#runtimes').style.opacity = fade(t, 0.2, 0.5); $('#brand').style.opacity = 0.6 * fade(t, 0.2, 0.5);

    // 1) Factory and Budget & cost slide in side by side.
    const a = prog(t, 0.05, 0.9), b = prog(t, 0.15, 0.95);
    // 2) Resources and Active goals follow.
    const c = prog(t, 1.1, 1.9), d = prog(t, 1.3, 2.1);
    // 3) The status bar rises along the bottom and is highlighted.
    const e = prog(t, 2.4, 3.1);
    const focus = prog(t, 3.3, 3.9, easeInOut);       // others dim a little while the status bar is in focus
    const dim = lerp(1, 0.72, focus);

    place($('#p-factory'), 'factory', 140 * (1 - a), 0, a * dim);
    place($('#p-budget'), 'budget', 0, 90 * (1 - b), b * dim);
    place($('#p-resources'), 'resources', -140 * (1 - c), 0, c * dim);
    place($('#p-goals'), 'goals', 0, 110 * (1 - d), d * lerp(1, 0.85, focus));
    place($('#p-status'), 'status', 0, 70 * (1 - e), e);

    // Worker sandbox row: highlighted from 2.3 s to 5.6 s (it stays readable at native size throughout).
    const rs = $('#ring-sandbox');
    const [gx, gy] = POS.goals;
    rs.style.left = (gx + SANDBOX_ROW.x) + 'px'; rs.style.top = (gy + SANDBOX_ROW.y) + 'px';
    rs.style.width = SANDBOX_ROW.w + 'px'; rs.style.height = SANDBOX_ROW.h + 'px';
    rs.style.opacity = (fade(t, 2.3, 0.35, 5.3) * 0.9).toFixed(3);

    const rb = $('#ring-status');
    const [sx, sy] = POS.status;
    rb.style.left = (sx + 6) + 'px'; rb.style.top = (sy - 4) + 'px';
    rb.style.width = '484px'; rb.style.height = '36px';
    rb.style.opacity = fade(t, 3.3, 0.4).toFixed(3);
  }
  Film.boot(seek);
})();
</script>
</body></html>
