<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Go guard</title>
<link rel="stylesheet" href="film.css">
<style>
  .head { position: absolute; left: 160px; top: 70px; }
  .head .title { font-size: 64px; }
  .head .title .arrow { color: var(--ink-3); font-weight: 500; padding: 0 6px; }
  .head .title .go { color: var(--accent); }
  .chart { position: absolute; left: 160px; top: 250px; width: 1600px; height: 420px; }
  .grid { position: absolute; top: 0; bottom: 34px; width: 1px; background: rgba(255,255,255,0.08); }
  .tick { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 20px; color: var(--ink-3); font-weight: 500; }
  .row { position: absolute; left: 0; height: 120px; width: 100%; }
  .row .lbl { position: absolute; left: 0; top: 0; font-size: 26px; font-weight: 600; color: var(--ink-2); }
  .bar { position: absolute; left: 0; top: 40px; height: 72px; border-radius: 0 12px 12px 0; }
  .bar.py { background: linear-gradient(90deg, rgb(90,90,95), rgb(142,142,147)); }
  .bar.go { background: linear-gradient(90deg, rgb(10,132,255), rgb(77,163,255)); box-shadow: 0 0 40px rgba(10,132,255,0.55); }
  .val { position: absolute; top: 52px; font-size: 40px; font-weight: 700; white-space: nowrap; }
  .val.go { color: var(--accent); }
  .axis { position: absolute; left: 0; width: 2px; top: 0; bottom: 34px; background: rgba(255,255,255,0.35); }
  .chips { position: absolute; left: 160px; top: 760px; display: flex; gap: 20px; }
  .chips .chip { height: 60px; padding: 0 28px; border-radius: 30px; font-size: 30px; }
</style>
</head><body>
<div class="backdrop"></div>
<div class="stage">
  <img class="brand" id="brand" src="../../images/wordmark-dark.svg" alt="Hivemill">
  <div class="head" id="head"><h1 class="title">≈69 ms <span class="arrow">→</span> <span class="go">≈8 ms</span> median per guard call</h1></div>
  <div class="chart" id="chart">
    <div id="ticks"></div>
    <div class="axis"></div>
    <div class="row" id="row-py" style="top: 30px"><div class="lbl">Python guard</div><div class="bar py" id="bar-py"></div><div class="val" id="val-py">≈69 ms</div></div>
    <div class="row" id="row-go" style="top: 200px"><div class="lbl">Go guard</div><div class="bar go" id="bar-go"></div><div class="val go" id="val-go">≈8 ms</div></div>
  </div>
  <div class="chips" id="chips">
    <div class="chip ok" id="c-measured"><span class="dot"></span>8.5–9× faster, measured</div>
    <div class="chip" id="c-default"><span class="dot"></span>Python remains default</div>
  </div>
</div>
<script src="film.js"></script>
<script>
(function () {
  'use strict';
  const { prog, fade, tr, $, easeInOut } = Film;
  // Drawn to scale: 20 px per millisecond, axis 0..70 ms. Medians from docs/worker-guard-go.md (measured).
  const PX_PER_MS = 20, PY_MS = 69, GO_MS = 8;
  const ticks = $('#ticks');
  for (let ms = 0; ms <= 70; ms += 10) {
    const g = document.createElement('div'); g.className = 'grid'; g.style.left = (ms * PX_PER_MS) + 'px'; ticks.appendChild(g);
    const l = document.createElement('div'); l.className = 'tick'; l.style.left = (ms * PX_PER_MS) + 'px';
    l.textContent = ms === 0 ? '0' : ms + ' ms'; ticks.appendChild(l);
  }

  function seek(t) {
    const h = prog(t, 0, 0.6);
    $('#head').style.opacity = h; $('#head').style.transform = tr(0, 20 * (1 - h));
    $('#brand').style.opacity = 0.6 * h;
    $('#chart').style.opacity = prog(t, 0.3, 0.9);

    // Both guards start together; Go finishes almost at once, Python keeps going.
    const py = prog(t, 1.0, 3.0, easeInOut);
    const go = prog(t, 1.0, 1.0 + 3.0 * GO_MS / PY_MS * 0.9 + 0.12, easeInOut);
    $('#bar-py').style.width = (PY_MS * PX_PER_MS * py).toFixed(1) + 'px';
    $('#bar-go').style.width = (GO_MS * PX_PER_MS * go).toFixed(1) + 'px';
    // Values appear only once their bar is complete (no running counter).
    const vp = $('#val-py'), vg = $('#val-go');
    vp.style.left = (PY_MS * PX_PER_MS - 190) + 'px';
    vp.style.opacity = prog(t, 3.0, 3.3); vp.style.color = '#fff';
    vg.style.left = (GO_MS * PX_PER_MS + 24) + 'px';
    vg.style.opacity = prog(t, 1.5, 1.8);
    // Go bar glow pulses gently once the comparison is complete.
    const pulse = t > 3.3 ? 0.4 + 0.25 * (1 + Math.sin((t - 3.3) * 2.6)) : 0.55 * go;
    $('#bar-go').style.boxShadow = '0 0 ' + Math.round(30 + 30 * pulse) + 'px rgba(10,132,255,' + pulse.toFixed(3) + ')';

    const c1 = prog(t, 3.6, 4.1), c2 = prog(t, 4.2, 4.7);
    $('#c-measured').style.opacity = c1; $('#c-measured').style.transform = tr(0, 20 * (1 - c1));
    $('#c-default').style.opacity = c2; $('#c-default').style.transform = tr(0, 20 * (1 - c2));
  }
  Film.boot(seek);
})();
</script>
</body></html>
