name: install

on:
  pull_request:
    branches: [main]
    paths:
      - "go/internal/install/**"
      - "go/cmd/hivemill-install/**"
      - "systemd/**"
      - "plugins/hivemill/scripts/**"
      # the installer builds and runs these, so a change to them can break the install
      - "go/cmd/hivemill/**"
      - "go/cmd/worker-guard/**"
      - "go/internal/**"
      - "go/go.mod"
      - "go/go.sum"
      - ".github/workflows/install.yml"
      - "ci/install_container_test.py"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # All pushes to main share one group (install-main): a newer merge cancels an older *pending* main run; a running one is never cancelled (T-1592).
  group: "install-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number || github.ref }}"
  cancel-in-progress: "${{ github.event_name != 'push' }}"

permissions:
  contents: read

jobs:
  install-go:
    name: install-go (shim + Go installer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - name: Go tests
        run: cd go && go test -race -count=1 ./cmd/hivemill-install/... ./internal/install/...
      - name: Run the installer through the shim (--check)
        run: |
          mkdir -p "$RUNNER_TEMP/rel" "$RUNNER_TEMP/plugin/scripts"
          (cd go && CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o "$RUNNER_TEMP/rel/hivemill-install-linux-amd64" ./cmd/hivemill-install)
          sum=$(sha256sum "$RUNNER_TEMP/rel/hivemill-install-linux-amd64" | cut -d' ' -f1)
          sed "s/^SHA_LINUX_AMD64=.*/SHA_LINUX_AMD64=\"$sum\"/" plugins/hivemill/scripts/install > "$RUNNER_TEMP/plugin/scripts/install"
          chmod +x "$RUNNER_TEMP/plugin/scripts/install"
          # exit 3 = something to install first, which is a valid --check answer on a CI runner
          HIVEMILL_INSTALL_BASE_URL="file://$RUNNER_TEMP/rel" "$RUNNER_TEMP/plugin/scripts/install" --check || [ $? -eq 3 ]
  install-smoke:
    name: install-smoke (${{ matrix.image }}, ${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
        ref: [head, latest]
    steps:
      # a bare image has no git: install it first so checkout leaves a real clone (the test installs the same packages)
      - name: Bootstrap git and python3
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git python3 ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # the workspace is copied to the plain user: no token in its git config
      # the installer builds hivemill and worker-guard from the clone, so the plain user needs a Go toolchain
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Run the installer as a plain user
        env:
          MODE: ${{ matrix.ref }}
        run: python3 ci/install_container_test.py --mode "$MODE" --workspace "$GITHUB_WORKSPACE"
